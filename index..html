<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistente com Claude</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        
        .container { width: 100%; max-width: 700px; background: white; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); overflow: hidden; display: flex; flex-direction: column; height: 85vh; max-height: 750px; }
        
        header { background: #5856d6; color: white; padding: 20px; text-align: center; }
        header h1 { font-size: 1.4rem; margin-bottom: 4px; }
        header p { font-size: 0.9rem; opacity: 0.85; }
        
        #chat { flex: 1; padding: 20px; overflow-y: auto; background: #f8f9fa; }
        
        .mensagem { margin-bottom: 16px; max-width: 85%; animation: aparece 0.3s ease; }
        @keyframes aparece { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        .usuario { margin-left: auto; }
        .assistente { margin-right: auto; }
        
        .balao { padding: 12px 16px; border-radius: 18px; line-height: 1.5; font-size: 0.95rem; }
        .usuario .balao { background: #5856d6; color: white; border-bottom-right-radius: 4px; }
        .assistente .balao { background: white; color: #333; border: 1px solid #e5e5e5; border-bottom-left-radius: 4px; }
        
        .entrada { display: flex; padding: 20px; gap: 10px; border-top: 1px solid #eee; background: white; }
        input { flex: 1; padding: 14px 18px; border: 2px solid #e5e5e5; border-radius: 30px; font-size: 0.95rem; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #5856d6; }
        button { padding: 14px 28px; background: #5856d6; color: white; border: none; border-radius: 30px; font-size: 0.95rem; cursor: pointer; transition: transform 0.2s, background 0.2s; }
        button:hover { background: #4848c7; transform: scale(1.03); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        .carregando { font-style: italic; color: #888; }
        .aviso { font-size: 0.8rem; color: #888; padding: 8px 20px; background: #fef3c7; border-top: 1px solid #fde68a; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🤖 Assistente Claude</h1>
            <p>Pergunte qualquer coisa — respondo em português</p>
        </header>

        <div id="chat"></div>
        
        <div class="aviso">
            ⚠️ Este frontend precisa de um backend (Node.js/Vercel) com sua chave da API. A chave NÃO fica aqui.
        </div>

        <div class="entrada">
            <input type="text" id="campo" placeholder="Digite sua mensagem...">
            <button id="enviar">Enviar</button>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const campo = document.getElementById('campo');
        const btn = document.getElementById('enviar');
        const sessaoId = `s${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;

        function addMensagem(remetente, texto) {
            const div = document.createElement('div');
            div.className = `mensagem ${remetente}`;
            div.innerHTML = `<div class="balao">${texto}</div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function enviar() {
            const texto = campo.value.trim();
            if (!texto) return;

            campo.value = '';
            btn.disabled = true;
            
            addMensagem('usuario', texto);
            const carregando = addMensagem('assistente', 'Pensando...');

            try {
                // 🔁 ALTERE ESTA URL para o seu backend
                const resposta = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mensagem: texto, sessaoId })
                });

                const dados = await resposta.json();
                carregando.remove();

                if (dados.resposta) {
                    addMensagem('assistente', dados.resposta);
                } else {
                    addMensagem('assistente', `❌ Erro: ${dados.erro || 'Sem resposta'}`);
                }
            } catch (erro) {
                carregando.remove();
                addMensagem('assistente', '❌ Não consegui conectar. Verifique se o backend está ativo.');
                console.error(erro);
            }

            btn.disabled = false;
        }

        btn.addEventListener('click', enviar);
        campo.addEventListener('keydown', e => e.key === 'Enter' && enviar());
    </script>
</body>
</html>
